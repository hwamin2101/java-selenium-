name: Automation CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - master

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Stage 1 - Run Checkstyle
        run: mvn validate

      - name: Stage 2 - Run TestNG Tests
        run: mvn test
